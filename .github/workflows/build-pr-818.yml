name: Build PR-818 image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/bixi0323/aether
  TAG: deepseek-queue-current

jobs:
  build:
    if: github.ref_name == 'codex/aether-deploy-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify required frontend source features
        run: |
          set -euo pipefail
          test -f frontend/src/features/usage/components/UsageApiKeyTable.vue
          grep -Fq 'data-testid="usage-api-key-analysis"' \
            frontend/src/features/usage/components/UsageApiKeyTable.vue
          grep -Fq '<UsageApiKeyTable' frontend/src/views/shared/Usage.vue
          grep -Fq '"ui.byApiKeyAnalysis"' frontend/src/i18n/ui-messages.ts
          grep -Fq '/api/admin/stats/leaderboard/api-keys' frontend/src/api/usage.ts

      - name: Patch Dockerfile for GitHub runners
        run: |
          set -euo pipefail
          sed -i '1s|^# syntax=.*|# syntax=docker/dockerfile:1|' Dockerfile.app.local
          sed -i 's|docker.m.daocloud.io/library/node:22-slim|node:22-slim|g' Dockerfile.app.local
          sed -i 's|docker.m.daocloud.io/library/rust:${RUST_VERSION}-slim|rust:${RUST_VERSION}-slim|g' Dockerfile.app.local
          sed -i '/npm config set registry/d' Dockerfile.app.local
          sed -i '/mirrors.tuna.tsinghua.edu.cn/d' Dockerfile.app.local || true
          sed -i 's|registry.npmmirror.com|registry.npmjs.org|g' \
            aether-vscodex/web/package-lock.json \
            frontend/package-lock.json
          head -40 Dockerfile.app.local

      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.app.local
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ env.TAG }}-${{ github.sha }}
          build-args: |
            AETHER_BUILD_VERSION=${{ env.TAG }}-${{ github.sha }}
            NODE_BASE_IMAGE=node:22-slim
            RUST_BASE_IMAGE=rust:1.95.0-slim
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify candidate image contains required features
        env:
          CANDIDATE_IMAGE: ${{ env.IMAGE }}:${{ env.TAG }}-${{ github.sha }}
        run: ./scripts/verify-image-frontend-features.sh "$CANDIDATE_IMAGE"

      - name: Publish verified image
        env:
          IMMUTABLE_IMAGE: ${{ env.IMAGE }}:${{ env.TAG }}-${{ github.sha }}
          MUTABLE_IMAGE: ${{ env.IMAGE }}:${{ env.TAG }}
        run: |
          set -euo pipefail
          docker push "$IMMUTABLE_IMAGE"
          docker push "$MUTABLE_IMAGE"
